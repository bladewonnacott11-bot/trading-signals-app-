<!-- ============================================================
     1. SVG ROOT
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">

  <!-- ============================================================
       2. BACKGROUND GRADIENT DEFINITION
       ============================================================ -->
  <defs>
    <linearGradient id="sdGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <!-- ============================================================
       3. ROUNDED BACKGROUND TILE
       ============================================================ -->
  <rect x="0" y="0" width="64" height="64" rx="16" ry="16" fill="url(#sdGradient)" />

  <!-- ============================================================
       4. UPWARD TREND LINE (SIGNAL)
       ============================================================ -->
  <polyline
    points="12,44 24,32 34,38 52,20"
    fill="none"
    stroke="#07080c"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.9"
  />

  <!-- ============================================================
       5. SIGNAL DOT AT THE END OF THE TREND LINE
       ============================================================ -->
  <circle cx="52" cy="20" r="4" fill="#07080c" opacity="0.9" />

</svg>
